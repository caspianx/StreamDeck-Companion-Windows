name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build portable zip
        shell: pwsh
        run: ./pc-companion/build-portable.ps1
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StreamDeck-Companion-Windows.zip
            dist/StreamDeck-Companion-Windows.zip.sha256
          generate_release_notes: true
